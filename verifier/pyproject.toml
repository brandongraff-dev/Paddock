# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paddock-verify"
version = "0.1.0"
description = "Independent verifier for Paddock containment attestations (spec v1): checks signature, key binding, freshness and disclosure, offline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["cryptography>=41"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
dev = ["pytest>=7.4", "jsonschema>=4.18", "PyYAML>=6"]

[project.scripts]
paddock-verify = "paddock_verify.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["paddock_verify*"]

[tool.setuptools.package-data]
paddock_verify = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
