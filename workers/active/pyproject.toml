[project]
name = "paddock-worker-active"
version = "1.0.0"
description = "Active probing worker for paddock. Polite. Loud. Transparent."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "redis>=5.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "structlog>=24.1",
  "orjson>=3.10",
  "tenacity>=8.2",
  "python-dateutil>=2.9",
  "dnspython>=2.6",
  "playwright>=1.44; python_version<'4'",
  "beautifulsoup4>=4.12",
  "lxml>=5.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
