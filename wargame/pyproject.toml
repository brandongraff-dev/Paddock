[project]
name = "paddock-wargame"
version = "0.1.0"
description = "Proving Ground: prove an attack-path hop by rebuilding the component in an isolated replica and running the real check against the copy -- never a live system."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "asyncpg>=0.29",
  "redis>=5.0",
  "httpx>=0.27",
  "pydantic>=2.6",
  "structlog>=24.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "anyio>=4.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
