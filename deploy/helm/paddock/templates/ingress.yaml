{{- if .Values.ingress.enabled }}
# Edge tier: the dashboard on "/" and the API on "/v1". /metrics, /docs,
# /openapi.json and the health endpoints are intentionally NOT routed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "paddock.fullname" . }}
  labels:
    {{- include "paddock.labels" . | nindent 4 }}
  annotations:
    {{- /* Server-Sent Events on /v1/events must not be buffered. */}}
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "paddock.componentName" (dict "root" $ "component" "orchestrator") }}
                port: {name: http}
          {{- if .Values.dashboard.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "paddock.componentName" (dict "root" $ "component" "dashboard") }}
                port: {name: http}
          {{- end }}
{{- end }}
