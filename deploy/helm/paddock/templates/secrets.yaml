{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- $s := .Values.secrets -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paddock.secretName" . }}
  labels:
    {{- include "paddock.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.postgresql.enabled }}
  DATABASE_URL: {{ include "paddock.databaseUrl" . | quote }}
  {{- end }}
  REDIS_URL: {{ include "paddock.redisUrl" . | quote }}
  JWT_SECRET: {{ include "paddock.stableSecret" (dict "root" $ "key" "JWT_SECRET" "value" $s.jwtSecret) | quote }}
  METRICS_TOKEN: {{ include "paddock.stableSecret" (dict "root" $ "key" "METRICS_TOKEN" "value" $s.metricsToken) | quote }}
  {{- with $s.adminBootstrapPassword }}
  ADMIN_BOOTSTRAP_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with $s.serviceApiKey }}
  SERVICE_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with $s.sentryTokens }}
  SENTRY_TOKENS: {{ . | quote }}
  {{- end }}
  {{- with $s.paddockSecretKey }}
  PADDOCK_SECRET_KEY: {{ . | quote }}
  {{- end }}
{{- if not .Values.postgresql.enabled }}
---
# Hook-managed copy of the DB connection for the pre-install/pre-upgrade
# migration Job (regular resources do not exist yet when it runs). Replaced
# on every upgrade; remove it manually after `helm uninstall`.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paddock.migrateSecretName" . }}
  labels:
    {{- include "paddock.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  DATABASE_URL: {{ include "paddock.databaseUrl" . | quote }}
  {{- with $s.migrateDatabaseUrl }}
  MIGRATE_DATABASE_URL: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
