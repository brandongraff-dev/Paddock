[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "palantir-asm-agent"
version = "0.1.0"
description = "palantir-asm fleet host agent: enroll, inventory, and GATED host-local defensive enforcement (propose->approve->apply, dry-run by default, reversible, audited)."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[project.scripts]
pasm = "palantir_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["palantir_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
