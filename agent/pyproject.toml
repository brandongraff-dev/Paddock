[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paddock-agent"
version = "0.2.0"
description = "paddock fleet host agent: one-time-token enrollment, signed host posture (Ed25519), and GATED host-local defensive enforcement (propose->approve->apply, dry-run by default, reversible, audited)."
requires-python = ">=3.8"
# Standard library only (owner decision O1). Ed25519 uses the 'cryptography' package when it is importable
# and otherwise a vendored pure-Python RFC 8032 signer; both produce byte-identical signatures.
dependencies = []

[project.optional-dependencies]
# Optional: a faster, constant-time Ed25519 via OpenSSL.
fast = [
    "cryptography>=3.4",
]
test = [
    "pytest>=7.4",
    "cryptography>=3.4",
]

[project.scripts]
paddock = "paddock_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["paddock_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
