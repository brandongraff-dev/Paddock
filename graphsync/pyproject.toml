[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "palantir-asm-graphsync"
version = "0.1.0"
description = "Neo4j graph mirror of the asset graph; exploit-weighted Cypher path/blast/neighborhood queries."
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.14",
    "asyncpg>=0.29",
    "aiohttp>=3.9",
    "uvloop>=0.19; sys_platform != 'win32'",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
