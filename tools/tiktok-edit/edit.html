 ctx.save();ctx.translate(.25*s-.08*s,-.05*s+.02*s);ctx.rotate(1.03);ctx.fillText(py?'pyi':ka?'apt':'fix',0,0);ctx.restore();

function triLayer(t){
 let hit=null;for(const h of HITS){const t0=sc(h.k);if(t>=t0&&t<t0+2*B)hit={...h,t0}}
 const firstEnd=sc(9),finEnd=sc(34);
 if(hit){const p=t-hit.t0,k=easeOut(seg(p,0,.12)),mv=ease(seg(p,1.45*B,2*B));

  const sx=(hash(Math.floor(t*60),5)-.5)*14*(1-mv)*(p<.3?1:.3);ctx.save();ctx.translate(sx,0);tri(cx,cy,s*(1+.035*bp),hit.v,Math.min(1,k*1.6));ctx.restore();

// ---------------- compositor
function render(t){
 if(!window.READY)return;
 ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.filter='none';ctx.shadowBlur=0;ctx.letterSpacing='0px';ctx.textAlign='left';
 ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);

 if(t<HORSE_T){

  let bp=0;for(const [ot,os] of ONS){const d=t-ot;if(d>=0&&d<.2)bp=Math.max(bp,(1-d/.2)*Math.min(1,os/2.2))}
  const hitNow=HITS.some(h=>t>=sc(h.k)&&t<sc(h.k)+.2);
  const sh=Math.pow(1-seg(lt,0,.2),2)*(k===0?0:14),z=1+.065*Math.pow(1-seg(lt,0,.16),2)+.016*bp;
  ctx.save();ctx.translate(W/2+(hash(Math.floor(t*60),1)-.5)*sh,H/2+(hash(Math.floor(t*60),2)-.5)*sh);ctx.scale(z,z);ctx.translate(-W/2,-H/2);

  if(S0.collage)collage(S0,lt,t);

  ctx.restore();

  if(lt>B/2){const q=1-seg(lt-B/2,0,.06);ctx.fillStyle=`rgba(255,255,255,${.06*q})`;ctx.fillRect(0,0,W,H)}

 }else{finale(t)}
 if(t<HORSE_T&&!HITS.some(h=>t>=sc(h.k)&&t<sc(h.k)+2*B))hud(t);
 triLayer(t);
 if(glitch>0&&t>.05){tctx.clearRect(0,0,W,H);tctx.drawImage(c,0,0);for(let i=0;i<9;i++){const y=Math.floor(hash(i,Math.floor(t*30))*H),h=24+hash(i,9)*90,dx=(hash(i,Math.floor(t*30)+3)-.5)*100*Math.min(1.4,glitch);ctx.fillStyle='#000';ctx.fillRect(0,y,W,h);ctx.drawImage(tmp,0,y,W,h,dx,y,W,h)}}
 // film grain: animated luma noise (lighter lifts blacks, overlay textures the brights)
 {const fr=Math.floor(t*24),gx=Math.floor(hash(fr,11)*256),gy=Math.floor(hash(fr,12)*256);
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.07;for(let x=-gx;x<W;x+=256)for(let y=-gy;y<H;y+=256)ctx.drawImage(window.NOISE,x,y);

 const v=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.4)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='rgba(0,0,0,.14)';for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,1);
 const fo=seg(t,END-.25,END);if(fo>0){ctx.fillStyle=`rgba(0,0,0,${fo})`;ctx.fillRect(0,0,W,H)}
}
