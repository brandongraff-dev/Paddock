[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paddock-sca"
version = "0.1.0"
description = "Software Composition Analysis: lockfile SBOM extraction, OSV vuln matching, and defensive supply-chain risk detection."
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "asyncpg>=0.29",
    "redis>=5.0",
    "orjson>=3.9",
    "pyyaml>=6.0",
    "uvloop>=0.19; sys_platform != 'win32'",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.risk.data" = ["*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
