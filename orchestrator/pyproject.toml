[project]
name = "paddock-orchestrator"
version = "0.1.0"
description = "Orchestrator service for the paddock defensive ASM platform."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.30",
    "redis>=5",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-json-logger>=2.0",
    "PyJWT>=2.8",
    "bcrypt>=4.0",
    "httpx>=0.27",          # outbound integrations
    "cryptography>=42",     # integration secrets at rest (AES-GCM)
    # SAML 2.0 SP (schema 020). xmlsec's manylinux wheel bundles libxml2 and
    # refuses to load if lxml was built against a different libxml2, so the
    # pair is pinned together (both on libxml2 2.14.6). Bump them as a pair.
    "python3-saml>=1.16,<2",
    "xmlsec==1.3.18",
    "lxml==6.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fakeredis>=2.20",
    "pytest-postgresql>=6",
    "hypothesis>=6.100",  # property-based scope fuzzing
    "ada-url>=1.15",      # WHATWG URL oracle for the differential fuzzer
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.setuptools.packages.find]
include = ["app*"]
