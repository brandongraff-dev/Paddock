  # ----------------------------------------------- learned per-class baselines
  - id: thermostat-new-port-after-learning
    expect: [behavior_drift]
    subject: {ip: 10.10.4.7}
    baseline: true
    params: {learn_s: 3600}
    learn_flows:
      - {src_ip: 10.10.4.7, dst_ip: 34.120.1.1, proto: tcp, dst_port: 443, first_seen: 1000, last_seen: 1000}
    flows:
      - {src_ip: 10.10.4.7, dst_ip: 34.120.1.1, proto: tcp, dst_port: 443, first_seen: 9000, last_seen: 9000}
      - {src_ip: 10.10.4.7, dst_ip: 185.199.1.1, proto: tcp, dst_port: 6667, first_seen: 9000, last_seen: 9000}
  - id: thermostat-known-behaviour-after-learning
    expect: []
    subject: {ip: 10.10.4.7}
    baseline: true
    params: {learn_s: 3600}
    learn_flows:
      - {src_ip: 10.10.4.7, dst_ip: 34.120.1.1, proto: tcp, dst_port: 443, first_seen: 1000, last_seen: 1000}
    flows:
      - {src_ip: 10.10.4.7, dst_ip: 34.120.9.9, proto: tcp, dst_port: 443, first_seen: 9000, last_seen: 9000}
  - id: thermostat-new-port-during-learning
    expect: []
    note: anything first seen inside the learning window is learned, not alerted
    subject: {ip: 10.10.4.7}
    baseline: true
    params: {learn_s: 3600}
    learn_flows:
      - {src_ip: 10.10.4.7, dst_ip: 34.120.1.1, proto: tcp, dst_port: 443, first_seen: 1000, last_seen: 1000}
    flows:
      - {src_ip: 10.10.4.7, dst_ip: 34.120.1.1, proto: tcp, dst_port: 8883, first_seen: 2000, last_seen: 2000}
