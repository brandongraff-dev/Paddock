# Sentry behaviour range. Devices are fingerprinted from `observations`
# (an ARP line with a vendor MAC is enough), then `flows` -- the aggregated
# shape Sentry ships -- go through otdiscovery.behavior.analyze. Only findings
# about the `subject` device count.
engine: ot_behaviour
defaults:
  observations:
    - {kind: arp, src_ip: 10.10.1.61, src_mac: "00:40:8c:00:00:61"}   # Axis camera (IoT)
    - {kind: arp, src_ip: 10.10.5.10, src_mac: "00:1b:1b:00:00:10"}   # Siemens PLC (OT)
    - {kind: arp, src_ip: 10.10.3.5, src_mac: "00:17:88:00:00:05"}    # Hue bridge (IoT)
    - {kind: arp, src_ip: 10.10.4.7, src_mac: "18:b4:30:00:00:07"}    # Nest thermostat (IoT)
    - {kind: arp, src_ip: 10.10.2.15, src_mac: "00:1b:78:00:00:15"}   # HP printer (IoT)
    - {kind: arp, src_ip: 10.10.9.5, src_mac: "00:50:56:00:00:05"}    # admin workstation (IT)
