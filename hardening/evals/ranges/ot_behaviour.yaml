  # ------------------------------------------------------- OT internet egress
  - id: plc-phones-home
    expect: [ot_internet_egress]
    subject: {ip: 10.10.5.10}
    flows:
      - {src_ip: 10.10.5.10, dst_ip: 8.8.4.4, proto: tcp, dst_port: 443, last_seen: 1000}
  - id: plc-to-internal-historian
    expect: []
    subject: {ip: 10.10.5.10}
    flows:
      - {src_ip: 10.10.5.10, dst_ip: 10.10.6.20, proto: tcp, dst_port: 1433, last_seen: 1000}
  - id: iot-camera-to-cloud-is-not-ot
    expect: []
    note: IoT cloud traffic is expected; only OT->internet is a policy violation
    subject: {ip: 10.10.1.61}
    flows:
      - {src_ip: 10.10.1.61, dst_ip: 52.10.20.30, proto: tcp, dst_port: 443, last_seen: 1000}
  - id: internet-scanner-hits-plc
    expect: []
    note: inbound to the PLC is exposure, not the PLC initiating egress
    subject: {ip: 10.10.5.10}
    flows:
      - {src_ip: 45.33.32.156, dst_ip: 10.10.5.10, proto: tcp, dst_port: 502, last_seen: 1000}

