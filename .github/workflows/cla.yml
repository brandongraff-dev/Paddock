name: CLA

# Contributor License Agreement check (see CLA.md and CONTRIBUTING.md).
# Signatures are stored as JSON in the `cla-signatures` branch of this repo;
# the action creates the branch on first use.
#
# Security: this uses pull_request_target so it can comment on PRs from forks,
# but it never checks out or runs PR code -- it only reads PR metadata.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write        # commit signatures to the cla-signatures branch
  pull-requests: write   # comment on / label the PR
  statuses: write        # set the CLA commit status

jobs:
  cla:
    name: CLA Assistant
    runs-on: ubuntu-latest
    # Only outside contributors sign. The repository's owner, members and
    # collaborators already hold the rights the CLA grants, including for
    # commits made on their behalf by coding agents (authored as a bot identity
    # that can't sign). For those PRs the job is skipped, which GitHub treats
    # as passing.
    if: >-
      (github.event_name == 'pull_request_target' &&
       !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: "https://github.com/${{ github.repository }}/blob/main/CLA.md"
          path-to-signatures: "signatures/version1/cla.json"
          branch: "cla-signatures"
          allowlist: "dependabot[bot],github-actions[bot],renovate[bot]"
          custom-notsigned-prcomment: >-
            Thanks for your contribution! Paddock is AGPL-3.0 and also offered under
            commercial licenses, so we ask contributors to sign our
            [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            (you keep your copyright; see CONTRIBUTING.md for why). To sign, reply with the
            sentence below.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA. Thank you!"
          lock-pullrequest-aftermerge: false
