name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------- #
  # Lint: the high-signal ruff rule set (see ruff.toml) across all services.
  # --------------------------------------------------------------------- #
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==0.16.9"
      - name: ruff check
        run: ruff check .

  # --------------------------------------------------------------------- #
  # Python services: one matrix leg per service. Each installs its own
  # package (with its test extra) and runs that service's pytest suite.
  #
  # A Postgres 16 service container is provided to every leg and exposed as
  # TEST_DATABASE_URL. Most services' DB-backed suites opt in via that var
  # and skip cleanly without it; the orchestrator instead spins up its own
  # disposable databases with pytest-postgresql (needs the pg server
  # binaries, installed below only for that leg).
  # --------------------------------------------------------------------- #
  python:
    name: py ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: orchestrator,    path: orchestrator,    extra: dev,  pg_bin: true }
          - { service: correlation,     path: correlation,     extra: test }
          - { service: intel,           path: intel,           extra: dev }
          - { service: sca,             path: sca,             extra: test }
          - { service: codeanalysis,    path: codeanalysis,    extra: test }
          - { service: mlrisk,          path: mlrisk,          extra: test }
          - { service: changewatch,     path: changewatch,     extra: test }
          - { service: triage,          path: triage,          extra: test }
          - { service: ontology,        path: ontology,        extra: test }
          - { service: threatintel,     path: threatintel,     extra: test }
          - { service: brain,           path: brain,           extra: test }
          - { service: graphsync,       path: graphsync,       extra: test }
          - { service: worker-passive,  path: workers/passive, extra: test }
          - { service: worker-active,   path: workers/active,  extra: dev }
          - { service: otdiscovery,     path: otdiscovery,     extra: test }
          - { service: sentry,          path: sentry,          extra: test }

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asm
          POSTGRES_PASSWORD: asm
          POSTGRES_DB: asm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U asm -d asm_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # Services whose DB-backed suites opt in read this; others ignore it and
      # their DB tests skip cleanly. Never point this at a real database — the
      # suites apply schema and truncate tables.
      TEST_DATABASE_URL: postgresql://asm:asm@localhost:5432/asm_test
      DATABASE_URL: postgresql://asm:asm@localhost:5432/asm_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure Postgres 16 server binaries (orchestrator / pytest-postgresql)
        if: ${{ matrix.pg_bin }}
        run: |
          if [ ! -d /usr/lib/postgresql/16/bin ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16 postgresql-client-16
          fi
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Install ${{ matrix.service }} (+ ${{ matrix.extra }} extra)
        working-directory: ${{ matrix.path }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.extra }}]"

      - name: pytest
        working-directory: ${{ matrix.path }}
        run: pytest -q

  # --------------------------------------------------------------------- #
  # Detection quality: seeded ranges (true positives + look-alikes) run
  # through each engine's real detection code; fails when any detector's
  # precision/recall drops below hardening/evals/thresholds.yaml, or when an
  # engine silently stops firing. See docs/EVALS.md.
  # --------------------------------------------------------------------- #
  evals:
    name: detection quality (evals)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engines under test
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest \
            -e ./codeanalysis -e ./sca -e ./otdiscovery -e ./correlation -e ./orchestrator
      - name: Harness self-tests
        run: pytest -q hardening/evals/test_harness.py
      - name: Precision/recall gate
        run: python hardening/evals/run.py --json evals-results.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-results
          path: evals-results.json

  # --------------------------------------------------------------------- #
  # Dashboard: type-check + unit tests (Vitest).
  # --------------------------------------------------------------------- #
  dashboard:
    name: dashboard (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Type-check
        run: npx tsc -b
      - name: Unit tests
        run: npx vitest run

  # --------------------------------------------------------------------- #
  # API contract: the committed OpenAPI spec + generated SDKs must match the
  # code, and /v1 must not break vs the base branch (docs/API.md). A PR
  # labelled `api-breaking` may break deliberately (reported, not failed).
  # --------------------------------------------------------------------- #
  api-contract:
    name: api contract (openapi + breaking changes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install orchestrator (for in-process spec export)
        run: pip install -e orchestrator pytest
      - name: Spec is up to date
        run: python scripts/export_openapi.py --check
      - name: SDKs are regenerated
        run: |
          python sdk/python/codegen.py --check
          node sdk/typescript/scripts/codegen.mjs --check
      - name: Contract tooling tests
        run: pytest -q scripts/tests
      - name: Breaking changes vs base branch
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          ALLOW: ${{ contains(github.event.pull_request.labels.*.name, 'api-breaking') }}
        run: |
          if ! git show "origin/${BASE_REF}:docs/api/openapi.json" > /tmp/base-openapi.json 2>/dev/null; then
            echo "No committed spec on ${BASE_REF} yet; skipping breaking-change diff." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          flags=""
          if [ "$ALLOW" = "true" ]; then flags="--allow-breaking"; fi
          set -o pipefail
          python scripts/openapi_diff.py /tmp/base-openapi.json docs/api/openapi.json --markdown $flags \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------- #
  # Developer platform: Python SDK + paddockctl, TypeScript SDK, Terraform
  # provider, docs site.
  # --------------------------------------------------------------------- #
  sdk-python:
    name: sdk python (+ paddockctl)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q

  sdk-typescript:
    name: sdk typescript (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  terraform-provider:
    name: terraform provider (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform-provider-paddock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: terraform-provider-paddock/go.mod
          cache-dependency-path: terraform-provider-paddock/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  docs:
    name: docs (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict

  # --------------------------------------------------------------------- #
  # Deploy artefacts: Helm chart (lint + template in 4 profiles +
  # kubeconform + hardening invariants), Prometheus rules (promtool check +
  # unit tests), Grafana dashboard JSON, compose file syntax.
  # --------------------------------------------------------------------- #
  deploy:
    name: deploy (helm + kubeconform + promtool)
    runs-on: ubuntu-latest
    env:
      HELM_VERSION: v3.16.4
      KUBECONFORM_VERSION: v0.6.7
      PROM_VERSION: 2.53.3
    steps:
      - uses: actions/checkout@v4
      - name: Install helm, kubeconform, promtool
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin" && cd "$(mktemp -d)"
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz
          mv linux-amd64/helm "$HOME/bin/"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz
          mv kubeconform "$HOME/bin/"
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" | tar -xz
          mv "prometheus-${PROM_VERSION}.linux-amd64/promtool" "$HOME/bin/"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Helm chart
        run: bash deploy/helm/ci-check.sh
      - name: Prometheus rules
        working-directory: deploy/prometheus
        run: |
          promtool check rules paddock-alerts.yml
          promtool test rules paddock-alerts.test.yml
      - name: Grafana dashboard is valid JSON
        run: python3 -c "import json; d=json.load(open('deploy/grafana/paddock-overview.json')); assert d['uid'] and d['panels']"
      - name: Backup/restore scripts parse
        run: bash -n scripts/backup.sh && bash -n scripts/restore.sh
