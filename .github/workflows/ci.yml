name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------- #
  # Lint: the high-signal ruff rule set (see ruff.toml) across all services.
  # --------------------------------------------------------------------- #
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==0.16.9"
      - name: ruff check
        run: ruff check .

  # --------------------------------------------------------------------- #
  # Python services: one matrix leg per service. Each installs its own
  # package (with its test extra) and runs that service's pytest suite.
  #
  # A Postgres 16 service container is provided to every leg and exposed as
  # TEST_DATABASE_URL. Most services' DB-backed suites opt in via that var
  # and skip cleanly without it; the orchestrator instead spins up its own
  # disposable databases with pytest-postgresql (needs the pg server
  # binaries, installed below only for that leg).
  # --------------------------------------------------------------------- #
  python:
    name: py ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: orchestrator,    path: orchestrator,    extra: dev,  pg_bin: true }
          - { service: correlation,     path: correlation,     extra: test }
          - { service: intel,           path: intel,           extra: dev }
          - { service: sca,             path: sca,             extra: test }
          - { service: codeanalysis,    path: codeanalysis,    extra: test }
          - { service: mlrisk,          path: mlrisk,          extra: test }
          - { service: changewatch,     path: changewatch,     extra: test }
          - { service: triage,          path: triage,          extra: test }
          - { service: ontology,        path: ontology,        extra: test }
          - { service: threatintel,     path: threatintel,     extra: test }
          - { service: brain,           path: brain,           extra: test }
          - { service: graphsync,       path: graphsync,       extra: test }
          - { service: worker-passive,  path: workers/passive, extra: test }
          - { service: worker-active,   path: workers/active,  extra: dev }
          - { service: otdiscovery,     path: otdiscovery,     extra: test }
          - { service: sentry,          path: sentry,          extra: test }

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asm
          POSTGRES_PASSWORD: asm
          POSTGRES_DB: asm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U asm -d asm_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # Services whose DB-backed suites opt in read this; others ignore it and
      # their DB tests skip cleanly. Never point this at a real database — the
      # suites apply schema and truncate tables.
      TEST_DATABASE_URL: postgresql://asm:asm@localhost:5432/asm_test
      DATABASE_URL: postgresql://asm:asm@localhost:5432/asm_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure Postgres 16 server binaries (orchestrator / pytest-postgresql)
        if: ${{ matrix.pg_bin }}
        run: |
          if [ ! -d /usr/lib/postgresql/16/bin ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16 postgresql-client-16
          fi
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Install ${{ matrix.service }} (+ ${{ matrix.extra }} extra)
        working-directory: ${{ matrix.path }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.extra }}]"

      - name: pytest
        working-directory: ${{ matrix.path }}
        run: pytest -q

  # --------------------------------------------------------------------- #
  # Dashboard: type-check + unit tests (Vitest).
  # --------------------------------------------------------------------- #
  dashboard:
    name: dashboard (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Type-check
        run: npx tsc -b
      - name: Unit tests
        run: npx vitest run
