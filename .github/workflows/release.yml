name: Release

# Supply-chain trust for Paddock itself (docs/trust/VERIFY.md has the
# consumer-side verification commands).
#
# On a version tag (vX.Y.Z) this workflow, for every service image:
#   1. builds it with Buildx (linux/amd64 + linux/arm64 where sensible),
#   2. pushes it to GHCR by digest,
#   3. generates SBOMs with syft (SPDX JSON + CycloneDX JSON),
#   4. signs the image with cosign KEYLESS (GitHub OIDC -> Fulcio cert,
#      recorded in the Rekor transparency log -- no long-lived signing key),
#   5. attaches both SBOMs as signed in-toto attestations (cosign attest),
#   6. emits SLSA build provenance (actions/attest-build-provenance), pushed
#      to the registry and to GitHub's attestation store,
# then creates the GitHub release with the SBOMs, a SHA256SUMS manifest of the
# image digests, and a keyless signature bundle for that manifest.
#
# The host agent ships as a single file, not an image (docs/AGENT_V2.md): the `agent` job builds the
# deterministic zipapp `paddock-agent.pyz`, the installer pinned to this tag, a `SHA256SUMS` over both and a
# keyless cosign bundle for it, and attaches SLSA build provenance for the archive. scripts/install-agent.sh
# verifies exactly these.
#
# Hardening notes: least-privilege `permissions` per job; no secrets other than
# the ephemeral GITHUB_TOKEN / OIDC token; every third-party action is pinned to a
# full commit SHA (the trailing comment names the tag it was taken from; refresh
# them with Dependabot or `pinact`) and cosign to an exact version.
#
# Trust root: a valid signature from this workflow only proves that THIS file ran at refs/tags/<tag>. The
# `gate` job runs first and every other job needs it, and it catches honest mistakes:
#   * it fails unless the tagged commit is reachable from the default branch (a tag cut from a stray
#     branch is refused), and
#   * it runs in the `release` environment, which you configure in the repository settings with required
#     reviewers and a deployment-tag rule for `v*.*.*`.
# What the gate cannot do: the workflow that runs is the file in the tagged commit, so the same commit that
# is tagged can delete `gate` (and the environment line): someone who may push a tag still gets a valid keyless
# signature.
# The controls that stop that are repository settings, not code: a tag ruleset that restricts who may create
# `v*.*.*` tags, the environment's deployment rules, and branch protection on the default branch. Cosign
# proves which workflow signed; it cannot prove the tagged commit was reviewed.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/paddock

jobs:
  gate:
    name: tag is on the default branch (release environment)
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0          # every branch, so the ancestry test below sees the default branch
          persist-credentials: false

      - name: The tagged commit must be reachable from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in v[0-9]*.[0-9]*.[0-9]*) : ;; *) echo "::error::unexpected tag $GITHUB_REF_NAME"; exit 1 ;; esac
          git rev-parse --verify --quiet "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}" >/dev/null \
            || { echo "::error::cannot find origin/${DEFAULT_BRANCH}"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}" \
            || { echo "::error::$GITHUB_REF_NAME (${GITHUB_SHA}) is not on ${DEFAULT_BRANCH}: refusing to release it"; exit 1; }

  images:
    name: image ${{ matrix.service }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write        # keyless signing (Fulcio) + provenance
      attestations: write    # GitHub attestation store
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: orchestrator,   context: ".", file: orchestrator/Dockerfile, platforms: "linux/amd64,linux/arm64" }
          - { service: dashboard,      context: dashboard,       platforms: "linux/amd64,linux/arm64" }
          - { service: worker-passive, context: workers/passive, platforms: "linux/amd64,linux/arm64" }
          # Playwright/Chromium + ProjectDiscovery binaries under QEMU are slow
          # and flaky; the active worker ships amd64 only.
          - { service: worker-active,  context: workers/active,  platforms: "linux/amd64" }
          - { service: intel,          context: intel,           platforms: "linux/amd64,linux/arm64" }
          - { service: brain,          context: brain,           platforms: "linux/amd64,linux/arm64" }
          - { service: mlrisk,         context: mlrisk,          platforms: "linux/amd64,linux/arm64" }
          - { service: changewatch,    context: changewatch,     platforms: "linux/amd64,linux/arm64" }
          - { service: triage,         context: triage,          platforms: "linux/amd64,linux/arm64" }
          - { service: correlation,    context: correlation,     platforms: "linux/amd64,linux/arm64" }
          - { service: sca,            context: sca,             platforms: "linux/amd64,linux/arm64" }
          - { service: codeanalysis,   context: codeanalysis,    platforms: "linux/amd64,linux/arm64" }
          - { service: graphsync,      context: graphsync,       platforms: "linux/amd64,linux/arm64" }
          - { service: ontology,       context: ontology,        platforms: "linux/amd64,linux/arm64" }
          - { service: threatintel,    context: threatintel,     platforms: "linux/amd64,linux/arm64" }
          - { service: otdiscovery,    context: otdiscovery,     platforms: "linux/amd64,linux/arm64" }
          - { service: remediation,    context: remediation,     platforms: "linux/amd64,linux/arm64" }
          - { service: agent,          context: agent,           platforms: "linux/amd64,linux/arm64" }
          - { service: sentry,         context: sentry,          platforms: "linux/amd64,linux/arm64" }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/paddock-${{ matrix.service }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=paddock-${{ matrix.service }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          # the orchestrator builds from the repo root (it ships schema/)
          file: ${{ matrix.file || format('{0}/Dockerfile', matrix.context) }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit's own provenance as well; the signed SLSA statement below
          # is the one consumers verify.
          provenance: mode=max
          sbom: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom/paddock-${{ matrix.service }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom/paddock-${{ matrix.service }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        with:
          cosign-release: 'v2.5.2'

      - name: Sign image + attest SBOMs (cosign keyless)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson \
            --predicate "sbom/paddock-${{ matrix.service }}.spdx.json" "$REF"
          cosign attest --yes --type cyclonedx \
            --predicate "sbom/paddock-${{ matrix.service }}.cdx.json" "$REF"

      - name: SLSA build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record digest
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}  ${{ env.IMAGE }}" > "digests/${{ matrix.service }}.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.service }}
          path: |
            sbom/
            digests/
          retention-days: 7

  agent:
    name: agent zipapp + installer
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # keyless signing (Fulcio)
      attestations: write    # GitHub attestation store
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build the zipapp, pin the installer to this tag, write SHA256SUMS
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in v[0-9]*.[0-9]*.[0-9]*) : ;; *) echo "unexpected tag $GITHUB_REF_NAME" >&2; exit 1 ;; esac
          mkdir -p agent-dist
          # the installer that ships with a release installs THAT release, never "latest"
          sed "s/^PINNED_TAG=.*/PINNED_TAG=\"${GITHUB_REF_NAME}\"/" scripts/install-agent.sh > agent-dist/install-agent.sh
          chmod 0755 agent-dist/install-agent.sh
          grep -q "^PINNED_TAG=\"${GITHUB_REF_NAME}\"\$" agent-dist/install-agent.sh
          # a CONSTANT epoch (1980-01-01, the zip minimum), so anyone can rebuild these bytes from the tag
          # (docs/AGENT_V2.md section 2): the commit time would be one more thing a rebuilder must reproduce
          SOURCE_DATE_EPOCH=315532800 python agent/packaging/build_zipapp.py \
            --out agent-dist/paddock-agent.pyz --sums agent-dist/SHA256SUMS --also agent-dist/install-agent.sh
          cat agent-dist/SHA256SUMS

      - name: Smoke test what will be published
        run: |
          set -euo pipefail
          shellcheck -s sh agent-dist/install-agent.sh
          python agent-dist/paddock-agent.pyz --version
          # a staged install from the files themselves: checksum gate, unit, modes (no systemd, no network)
          sh agent-dist/install-agent.sh --server https://paddock.invalid --root "$RUNNER_TEMP/stage" \
            --base-url "file://$PWD/agent-dist" --python "$(command -v python3)" --no-enroll
          test -x "$RUNNER_TEMP/stage/usr/local/lib/paddock-agent/paddock-agent.pyz"

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        with:
          cosign-release: 'v2.5.2'

      - name: Sign SHA256SUMS (cosign keyless)
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle agent-dist/SHA256SUMS.sigstore.json agent-dist/SHA256SUMS
          # prove the bundle verifies against this workflow's own identity, the way the installer will
          cosign verify-blob --bundle agent-dist/SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com agent-dist/SHA256SUMS

      - name: SLSA build provenance for the archive
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: agent-dist/paddock-agent.pyz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-agent-pyz
          path: |
            agent-dist/paddock-agent.pyz
            agent-dist/install-agent.sh
            agent-dist/SHA256SUMS
            agent-dist/SHA256SUMS.sigstore.json
          retention-days: 7

  release:
    name: GitHub release
    needs: [gate, images, agent]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
      id-token: write        # keyless-sign the manifest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: out

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        with:
          cosign-release: 'v2.5.2'

      - name: Digest manifest + keyless signature
        working-directory: out
        run: |
          set -euo pipefail
          sort digests/*.txt > IMAGE_DIGESTS.txt
          (cd sbom && sha256sum *.json) > SBOM_SHA256SUMS.txt
          cosign sign-blob --yes --bundle IMAGE_DIGESTS.txt.sigstore.json IMAGE_DIGESTS.txt
          cosign sign-blob --yes --bundle SBOM_SHA256SUMS.txt.sigstore.json SBOM_SHA256SUMS.txt

      - name: Release notes with the host agent digests
        run: |
          set -euo pipefail
          {
            echo "## Host agent"
            echo
            echo "sha256 of the host agent files attached to this release (the same lines as \`SHA256SUMS\`):"
            echo
            echo '```'
            cat out/SHA256SUMS
            echo '```'
            echo
            echo "These digests come from this same release, so on their own they do not authenticate it: verify"
            echo "\`SHA256SUMS.sigstore.json\` with cosign 2.4 or newer, or rebuild the archive from this tag"
            echo "(docs/AGENT_V2.md, section 2) and compare."
          } > release-body.md

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          body_path: release-body.md
          files: |
            out/sbom/*.json
            out/IMAGE_DIGESTS.txt
            out/IMAGE_DIGESTS.txt.sigstore.json
            out/SBOM_SHA256SUMS.txt
            out/SBOM_SHA256SUMS.txt.sigstore.json
            out/paddock-agent.pyz
            out/install-agent.sh
            out/SHA256SUMS
            out/SHA256SUMS.sigstore.json
