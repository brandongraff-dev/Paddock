[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paddock-intel"
version = "0.1.0"
description = "Threat-intel ingestion service: NVD / EPSS / KEV / OSV + CPE-based CVE<->asset matching."
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "asyncpg>=0.29",
    "redis>=5.0",
    "aiohttp-middlewares>=2.2",
    "uvloop>=0.19; sys_platform != 'win32'",
    "orjson>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-aiohttp>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
