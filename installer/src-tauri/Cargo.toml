[package]
name = "paddock-setup"
version = "0.1.0"
edition = "2021"
description = "Paddock Setup: a wizard around scripts/install.ps1"
license = "AGPL-3.0-only"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
paddock-installer-core = { path = "../core" }

[features]
# `tauri build` turns this on: serve the bundled UI instead of the dev server
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
