    <script type="application/ld+json">[{"@context": "https://schema.org", "@type": "SoftwareApplication", "name": "Paddock", "applicationCategory": "SecurityApplication", "operatingSystem": "Linux, Docker", "description": "Open-source, self-hosted attack surface management. Paddock maps the real paths from your internet-facing assets to your crown jewels, with threat intel, supply-chain checks and fix routing. Defensive only.", "url": "https://www.openpaddock.dev", "license": "https://www.gnu.org/licenses/agpl-3.0.html", "isAccessibleForFree": true, "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}, "codeRepository": "https://github.com/brandongraff-dev/Paddock"}, {"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "Is it legal to run?", "acceptedAnswer": {"@type": "Answer", "text": "Yes, against assets you own or are explicitly authorised to assess. Paddock checks every request against your scope at several layers, asks you to prove control of a domain before it is treated as in scope, and writes every decision to a tamper-evident audit log. Never point it at anything else."}}, {"@type": "Question", "name": "Does it attack or exploit anything?", "acceptedAnswer": {"@type": "Answer", "text": "No. It has no exploit framework, no payload delivery, no credential attacks and no evasion. Dangerous scan categories are blocked in code, and default-credential risk is found by recognising the product, never by trying passwords."}}, {"@type": "Question", "name": "How is this different from a vulnerability scanner?", "acceptedAnswer": {"@type": "Answer", "text": "A scanner hands you a list. Paddock builds a graph of your assets and the weaknesses on them, then walks it to show the paths an attacker could take from the internet to something that matters. Related findings are folded into one ranked story, each with the reason it ranks where it does."}}, {"@type": "Question", "name": "Where does my data go?", "acceptedAnswer": {"@type": "Answer", "text": "Paddock runs on your own infrastructure and keeps findings in your own database. It reaches out only to public data sources (such as certificate logs, DNS and vulnerability feeds) and to services you configure yourself, such as chat, ticketing or an LLM."}}, {"@type": "Question", "name": "Is it ready for production?", "acceptedAnswer": {"@type": "Answer", "text": "It is early. The core pipeline works end to end and has a broad automated test suite, but it has been validated mostly on synthetic data and one live reference host. Run it in the hardened profile, read the security policy, and treat its risk scores as a starting point."}}, {"@type": "Question", "name": "What does it cost?", "acceptedAnswer": {"@type": "Answer", "text": "Self-hosting the Community edition is free under the AGPL-3.0. Paid editions with enterprise features and support are planned."}}]}]</script>
