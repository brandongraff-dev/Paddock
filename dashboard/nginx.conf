worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout  65;

  # Proxy upstream — resolvable inside the docker-compose network.
  upstream orchestrator_upstream {
    server orchestrator:8080;
  }

  server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static asset caching
    location ~* \.(?:js|css|woff2|png|svg|ico)$ {
      expires 7d;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # API passthrough — orchestrator owns /v1/*
    location /v1/ {
      proxy_pass http://orchestrator_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # SSE tuning: no buffering, infinite read timeout.
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 24h;
      proxy_send_timeout 24h;
      chunked_transfer_encoding on;
    }

    # Universal ingest: scanner reports are larger than nginx's 1 MB default.
    # The orchestrator enforces the real cap (PADDOCK_INGEST_MAX_BYTES, 25 MiB).
    location /v1/ingest {
      client_max_body_size 32m;
      proxy_request_buffering off;
      proxy_pass http://orchestrator_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
    }

    # SCIM 2.0 provisioning (Okta / Entra) — orchestrator owns /scim/v2/*
    location /scim/ {
      proxy_pass http://orchestrator_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Security headers (defensive-only app; no external trackers)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  }
}
