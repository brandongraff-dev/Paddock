id: leaked_secret_live_endpoint
name: "Leaked secret candidate for a live endpoint"
severity: high
window_days: 90
all_of:
  - finding:
      rule_source: secret_scan
    scope: same_org
  - asset:
      kind: endpoint
    scope: same_org
impact: |
  A secret candidate was discovered in a public location and the same
  organisation operates a live endpoint ({host}) that the secret could
  authenticate to. The combination makes credential rotation urgent:
  the secret may already be in use by third parties, and the live
  endpoint is reachable from the internet.
remediation:
  - Rotate the exposed credential immediately.
  - Audit access logs on the affected endpoint for anomalous use.
  - Scrub the secret from upstream history (git/blob storage) and
    verify no cached copies remain.
