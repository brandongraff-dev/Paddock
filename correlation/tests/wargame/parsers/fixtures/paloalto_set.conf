# Synthetic PAN-OS set-format config (no real hosts). Zones: untrust, web, app, db, mgmt.
set deviceconfig system hostname fw-edge-01
set deviceconfig system ip-address 192.0.2.10
set network interface ethernet ethernet1/1 layer3 ip 203.0.113.2/29
set zone web network layer3 ethernet1/2

# --- addresses ---------------------------------------------------------
set address web-srv-1 ip-netmask 10.10.1.10/32
set address web-srv-2 ip-netmask 10.10.1.11
set address web-net ip-netmask 10.10.1.0/24 description "DMZ web tier"
set address app-net ip-netmask 10.20.1.0/24
set address legacy-app ip-range 10.20.1.100-10.20.1.110
set address db-net ip-netmask 10.30.1.0/24
set address admin-jump ip-netmask 10.99.0.5/32
set address updates-fqdn fqdn updates.example.test

# --- address groups ----------------------------------------------------
set address-group web-servers static [ web-srv-1 web-srv-2 ]
set address-group app-servers static [ app-net ]
set address-group dag-quarantined dynamic filter "'quarantined' and 'prod'"

# --- services ----------------------------------------------------------
set service svc-app protocol tcp port 8080,8443
set service svc-db-range protocol tcp port 5432-5439
set service svc-dns-udp protocol udp port 53
set service-group grp-db-services members [ svc-db-range svc-dns-udp ]

# --- security rules (top to bottom) ------------------------------------
set rulebase security rules deny-legacy-app from web
set rulebase security rules deny-legacy-app to app
set rulebase security rules deny-legacy-app source web-servers
set rulebase security rules deny-legacy-app destination legacy-app
set rulebase security rules deny-legacy-app application any
set rulebase security rules deny-legacy-app service any
set rulebase security rules deny-legacy-app action deny

set rulebase security rules web-to-app from web
set rulebase security rules web-to-app to app
set rulebase security rules web-to-app source web-servers
set rulebase security rules web-to-app destination app-servers
set rulebase security rules web-to-app application any
set rulebase security rules web-to-app service svc-app
set rulebase security rules web-to-app action allow

set rulebase security rules app-to-db from app
set rulebase security rules app-to-db to db
set rulebase security rules app-to-db source app-servers
set rulebase security rules app-to-db destination db-net
set rulebase security rules app-to-db application any
set rulebase security rules app-to-db service grp-db-services
set rulebase security rules app-to-db action allow

set rulebase security rules inet-to-web-apps from untrust
set rulebase security rules inet-to-web-apps to web
set rulebase security rules inet-to-web-apps source any
set rulebase security rules inet-to-web-apps destination web-servers
set rulebase security rules inet-to-web-apps application [ web-browsing ssl ]
set rulebase security rules inet-to-web-apps service service-https
set rulebase security rules inet-to-web-apps action allow

set rulebase security rules inet-to-web-default from untrust
set rulebase security rules inet-to-web-default to web
set rulebase security rules inet-to-web-default source any
set rulebase security rules inet-to-web-default destination web-net
set rulebase security rules inet-to-web-default application any
set rulebase security rules inet-to-web-default service application-default
set rulebase security rules inet-to-web-default action allow

set rulebase security rules admin-to-app from mgmt
set rulebase security rules admin-to-app to app
set rulebase security rules admin-to-app source admin-jump
set rulebase security rules admin-to-app destination app-servers
set rulebase security rules admin-to-app source-user "example\netadmins"
set rulebase security rules admin-to-app application any
set rulebase security rules admin-to-app service ssh
set rulebase security rules admin-to-app action allow

set rulebase security rules web-to-updates from web
set rulebase security rules web-to-updates to untrust
set rulebase security rules web-to-updates source web-servers
set rulebase security rules web-to-updates destination updates-fqdn
set rulebase security rules web-to-updates application any
set rulebase security rules web-to-updates service service-https
set rulebase security rules web-to-updates action allow

set rulebase security rules quarantine-block from [ web app ]
set rulebase security rules quarantine-block to db
set rulebase security rules quarantine-block source dag-quarantined
set rulebase security rules quarantine-block destination any
set rulebase security rules quarantine-block application any
set rulebase security rules quarantine-block service any
set rulebase security rules quarantine-block action drop

set rulebase security rules cleanup-deny from any
set rulebase security rules cleanup-deny to any
set rulebase security rules cleanup-deny source any
set rulebase security rules cleanup-deny destination any
set rulebase security rules cleanup-deny application any
set rulebase security rules cleanup-deny service any
set rulebase security rules cleanup-deny action deny
