#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0
config system global
    set hostname "FGT-EDGE-01"
end
config firewall address
    edit "all"
    next
    edit "LAN_NET"
        set subnet 10.10.0.0 255.255.0.0
    next
    edit "DMZ_WEB"
        set subnet 172.16.10.10 255.255.255.255
    next
    edit "DMZ_APP"
        set subnet 172.16.20.0 255.255.255.0
    next
    edit "VENDOR_RANGE"
        set type iprange
        set start-ip 203.0.113.16
        set end-ip 203.0.113.31
    next
    edit "updates.example.com"
        set type fqdn
        set fqdn "updates.example.com"
    next
    edit "BLOCKED_COUNTRIES"
        set type geography
        set country "XX"
    next
end
config firewall addrgrp
    edit "DMZ_SERVERS"
        set member "DMZ_WEB" "DMZ_APP"
        set comment "web and app tier"
    next
end
config firewall service custom
    edit "WEB_ALT"
        set tcp-portrange 8000-8100
    next
    edit "APP_API"
        set tcp-portrange 8443 9000:1024-65535
        set udp-portrange 5353
    next
    edit "ALL_PING"
        set protocol ICMP
    next
end
config firewall service group
    edit "WEB_SERVICES"
        set member "HTTPS" "WEB_ALT"
    next
end
config firewall policy
    edit 1
        set name "lan-to-dmz-deny-telnet"
        set srcintf "lan"
        set dstintf "dmz"
        set srcaddr "LAN_NET"
        set dstaddr "DMZ_SERVERS"
        set action deny
        set schedule "always"
        set service "TELNET"
    next
    edit 2
        set name "lan-to-dmz-web"
        set srcintf "lan"
        set dstintf "dmz"
        set srcaddr "LAN_NET"
        set dstaddr "DMZ_SERVERS"
        set action accept
        set schedule "always"
        set service "WEB_SERVICES" "APP_API" "ALL_PING"
    next
    edit 3
        set name "lan-to-wan-updates"
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "LAN_NET"
        set dstaddr "updates.example.com"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set nat enable
    next
    edit 4
        set name "vendor-to-dmz"
        set srcintf "wan1"
        set dstintf "dmz"
        set srcaddr "VENDOR_RANGE"
        set dstaddr "DMZ_WEB"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 5
        set name "old-wan-any"
        set status disable
        set srcintf "wan1"
        set dstintf "lan"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 6
        set name "lan-any-out"
        set srcintf "lan"
        set dstintf "wan1"
        set srcaddr "LAN_NET"
        set dstaddr "all"
        set service "DNS"
    next
end
config router static
    edit 1
        set gateway 198.51.100.1
        set device "wan1"
    next
end
