[project]
name = "palantir-asm-correlation"
version = "0.1.0"
description = "Correlation engine: chain detection, policies-as-code, blast-radius scoring for palantir-asm."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "asyncpg>=0.29",
  "redis>=5.0",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "watchfiles>=0.21",
  "structlog>=24.1",
  "sqlglot>=23.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "anyio>=4.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
